[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optosimlab"
version = "0.8.0"
description = "Differentiable signal-level optical simulation with PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docs = ["reportlab>=4.0", "pypdf>=4.0", "pdfplumber>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
